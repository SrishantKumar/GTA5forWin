name: Build Windows Executable (GTA5forWin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug

jobs:
  build-windows:
    name: Build Native Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Pre-Generated AOT Engine Sources
        shell: pwsh
        run: |
          $assetUrl = "https://github.com/SrishantKumar/GTA5forWin/releases/download/v0.1.0-assets/engine-generated.tar.gz"
          Write-Host "Downloading precompiled AOT engine sources from $assetUrl..."
          try {
            Invoke-WebRequest -Uri $assetUrl -OutFile "engine-generated.tar.gz" -TimeoutSec 300
            Write-Host "Unpacking engine sources..."
            tar -xzf engine-generated.tar.gz
            Remove-Item "engine-generated.tar.gz" -Force
            Get-ChildItem -Path app -Recurse -Filter "._*" -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Warning "Failed to download precompiled AOT engine sources: $_"
          }

          if (Test-Path "app/Generated/game.h") {
            Write-Host "[SUCCESS] AOT Game Engine found! Compiling full native ~300 MB GTA5Port.exe"
            python app/Scripts/prepare_memory_base.py
          } else {
            Write-Host "[INFO] AOT engine sources not present; compiling native host shell with stubs."
            python app/Scripts/stub_asi_natives.py
          }

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/third_party/webview2/build/native/x64/WebView2Loader.dll")) {
            Write-Host "Fetching Microsoft.Web.WebView2 package..."
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.2903.40/microsoft.web.webview2.1.0.2903.40.nupkg" -OutFile "webview2.zip" -TimeoutSec 120
            New-Item -ItemType Directory -Force -Path "windows/third_party/webview2" | Out-Null
            tar -xf webview2.zip -C "windows/third_party/webview2"
            Remove-Item "webview2.zip" -Force
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($clangCl) {
            Write-Host "Configuring with Clang-CL: $($clangCl.Source)"
            cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          } else {
            Write-Host "Configuring with standard MSVC cl.exe"
            cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}
          }

      - name: Build GTA5Port.exe
        run: |
          cmake --build build --config ${{ github.event.inputs.build_type || 'Release' }} --parallel

      - name: Locate & Stage Binary
        id: stage
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path build -Recurse -Filter "GTA5Port.exe" | Select-Object -First 1
          if (-not $bin) {
            Write-Error "GTA5Port.exe was not found in build directory!"
            exit 1
          }
          Write-Host "Found binary at: $($bin.FullName)"
          $sizeMb = [math]::Round($bin.Length / 1MB, 2)
          Write-Host "Binary size: $sizeMb MB"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bin.FullName -Destination dist\GTA5Port.exe
          Copy-Item -Path "windows\launcher" -Destination "dist\launcher" -Recurse -Force
          Copy-Item -Path "windows\assets" -Destination "dist\assets" -Recurse -Force
          $loader = Get-ChildItem -Path windows -Recurse -Filter "WebView2Loader.dll" | Select-Object -First 1
          if ($loader) {
            Copy-Item $loader.FullName -Destination "dist\WebView2Loader.dll" -Force
          }
          Copy-Item build_win.bat -Destination dist\build_win.bat -ErrorAction SilentlyContinue
          Copy-Item WINDOWS_BUILD.md -Destination dist\README.txt -ErrorAction SilentlyContinue

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA5forWin-x64-${{ github.event.inputs.build_type || 'Release' }}
          path: dist
          if-no-files-found: error
