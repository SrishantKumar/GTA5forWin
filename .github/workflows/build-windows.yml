name: Build Windows Executable (GTA5forWin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      game_wasm_url:
        description: 'Direct download URL for game.wasm (optional: if not in repo)'
        required: false
        default: ''
        type: string

jobs:
  generate-engine:
    name: Generate Native AOT Engine (macOS)
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AOT Engine Generator
        id: aot
        run: |
          if [ -f "game.wasm" ]; then
            echo "Found game.wasm in repository root. Running AOT preparation..."
            python3 app/Scripts/prepare_aot.py --wasm game.wasm
            echo "has_engine=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.game_wasm_url }}" ]; then
            echo "Downloading game.wasm from provided URL..."
            python3 app/Scripts/prepare_aot.py --url "${{ github.event.inputs.game_wasm_url }}"
            echo "has_engine=true" >> "$GITHUB_OUTPUT"
          elif [ -f "app/Generated/game.h" ]; then
            echo "Found pre-generated engine sources."
            echo "has_engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "No game.wasm or URL provided; skipping AOT generation."
            echo "has_engine=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive Generated Engine
        if: steps.aot.outputs.has_engine == 'true'
        run: |
          tar -czf engine-generated.tar.gz \
            app/Generated \
            app/Tools/simde \
            app/Tools/wabt-1.0.42/include \
            app/Tools/wabt-1.0.42/share

      - name: Upload Generated Engine Artifact
        if: steps.aot.outputs.has_engine == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aot-engine-sources
          path: engine-generated.tar.gz
          retention-days: 1

  build-windows:
    name: Build Native Windows x64 Executable
    needs: [generate-engine]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Generated Engine Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aot-engine-sources
          path: .

      - name: Unpack Engine Sources or Prepare Stubs
        shell: pwsh
        run: |
          if (Test-Path "engine-generated.tar.gz") {
            Write-Host "Unpacking AOT engine archive..."
            tar -xzf engine-generated.tar.gz
            Remove-Item "engine-generated.tar.gz" -Force
          }
          if (Test-Path "app/Generated/game.h") {
            Write-Host "AOT Game Engine detected! Compiling full native ~300 MB GTA5Port.exe"
          } else {
            Write-Host "No AOT engine found; building native host shell with stubs."
            python app/Scripts/stub_asi_natives.py
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $clangCl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($clangCl) {
            Write-Host "Configuring with Clang-CL: $($clangCl.Source)"
            cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          } else {
            Write-Host "Configuring with standard MSVC cl.exe"
            cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}
          }

      - name: Build GTA5Port.exe
        run: |
          cmake --build build --config ${{ github.event.inputs.build_type || 'Release' }} --parallel

      - name: Locate & Stage Binary
        id: stage
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path build -Recurse -Filter "GTA5Port.exe" | Select-Object -First 1
          if (-not $bin) {
            Write-Error "GTA5Port.exe was not found in build directory!"
            exit 1
          }
          Write-Host "Found binary at: $($bin.FullName)"
          $sizeMb = [math]::Round($bin.Length / 1MB, 2)
          Write-Host "Binary size: $sizeMb MB"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bin.FullName -Destination dist\GTA5Port.exe
          Copy-Item build_win.bat -Destination dist\build_win.bat -ErrorAction SilentlyContinue
          Copy-Item WINDOWS_BUILD.md -Destination dist\README.txt -ErrorAction SilentlyContinue

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA5forWin-x64-${{ github.event.inputs.build_type || 'Release' }}
          path: dist/*
          if-no-files-found: error
